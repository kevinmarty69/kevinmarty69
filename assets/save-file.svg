<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Kévin Marty - Product Engineer and Applied AI builder</title>
  <desc id="desc">A retro save-file interface showing Kévin Marty's product engineering loop from framing to production feedback.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8b2d1" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9ff66"/>
      <stop offset="1" stop-color="#73e7ff"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .label{font-size:14px;letter-spacing:2px;font-weight:700}
      .tiny{font-size:12px;letter-spacing:1.4px;font-weight:700}
      .node{font-size:13px;letter-spacing:1.2px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#080b12"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <path d="M24 96H1176M24 374H1176" stroke="#a8b2d1" stroke-opacity=".16"/>

  <g class="mono label">
    <text x="48" y="58" fill="#b9ff66">SAVE FILE 01</text>
    <text x="1152" y="58" fill="#73e7ff" text-anchor="end">STATUS: SHIPPING</text>
  </g>
  <rect x="48" y="74" width="78" height="4" fill="#b9ff66"/>
  <rect x="132" y="74" width="30" height="4" fill="#73e7ff"/>
  <rect x="168" y="74" width="12" height="4" fill="#ff6b9d"/>

  <g class="mono">
    <text x="48" y="164" fill="#f5f7ff" font-size="58" font-weight="800" letter-spacing="-2">KÉVIN MARTY</text>
    <text x="51" y="203" fill="#a8b2d1" font-size="19" font-weight="700" letter-spacing="3">PRODUCT ENGINEER // APPLIED AI</text>
    <text x="51" y="260" fill="#f5f7ff" font-size="22">Messy problem in.</text>
    <text x="51" y="292" fill="url(#glow)" font-size="22" font-weight="700">Working system out.</text>
    <text x="51" y="332" fill="#7f8aa8" font-size="14">I stay for production.</text>
  </g>

  <g transform="translate(820 208)" class="mono">
    <circle r="116" fill="#0d1220" stroke="#263149" stroke-width="2"/>
    <circle r="78" fill="none" stroke="#263149" stroke-dasharray="4 7"/>
    <circle r="38" fill="#101827" stroke="#b9ff66" stroke-width="2" filter="url(#soft-glow)"/>
    <text y="-5" fill="#f5f7ff" font-size="15" font-weight="800" text-anchor="middle">SHIP</text>
    <text y="15" fill="#b9ff66" font-size="10" letter-spacing="1.5" text-anchor="middle">THE LOOP</text>

    <path d="M0-78A78 78 0 0 1 78 0M78 0A78 78 0 0 1 0 78M0 78A78 78 0 0 1-78 0M-78 0A78 78 0 0 1 0-78" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M69-10l10 10-10 10M10 69L0 79l-10-10M-69 10l-10-10 10-10M-10-69L0-79l10 10" fill="none" stroke="#73e7ff" stroke-width="2"/>

    <g class="node">
      <rect x="-43" y="-132" width="86" height="28" rx="4" fill="#161e2f" stroke="#33415d"/>
      <text x="0" y="-113" fill="#f5f7ff" text-anchor="middle">FRAME</text>
      <rect x="94" y="-14" width="80" height="28" rx="4" fill="#161e2f" stroke="#33415d"/>
      <text x="134" y="5" fill="#f5f7ff" text-anchor="middle">BUILD</text>
      <rect x="-39" y="104" width="78" height="28" rx="4" fill="#161e2f" stroke="#33415d"/>
      <text x="0" y="123" fill="#f5f7ff" text-anchor="middle">LEARN</text>
      <rect x="-174" y="-14" width="80" height="28" rx="4" fill="#161e2f" stroke="#33415d"/>
      <text x="-134" y="5" fill="#f5f7ff" text-anchor="middle">MODEL</text>
    </g>
  </g>

  <g class="mono tiny" fill="#7f8aa8">
    <text x="48" y="408">TYPESCRIPT</text>
    <text x="178" y="408">PYTHON</text>
    <text x="277" y="408">REACT</text>
    <text x="366" y="408">POSTGRESQL</text>
    <text x="505" y="408">LLM SYSTEMS</text>
    <text x="1152" y="408" fill="#b9ff66" text-anchor="end">FRANCE // REMOTE</text>
  </g>
</svg>
